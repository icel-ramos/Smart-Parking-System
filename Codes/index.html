<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Park Easy - Sign In</title>
  <link rel="stylesheet" href="Login.css">
  <script src="Login.js" defer></script>
</head>
<body>

  <main class="login-backdrop">
    <!-- Subtle Isometric Parking Grid Background Pattern -->
    <div class="bg-grid-pattern"></div>

    <div class="login-center">
      <!-- Top Brand Logo -->
      <div class="brand-logo">
            <span>🅿️</span> Park Easy
        </div>

      <!-- Centered White Login Card -->
      <section class="login-card">
        <div class="card-header">
          <h1>Sign in to Park Easy</h1>
          <p>Admin Dashboard Access</p>
        </div>

        <form action="#">
          <!-- Email Input -->
          <div class="input-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <!-- Envelope SVG Icon -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
              </span>
              <input type="email" id="email" placeholder="e.g., JuanDelaCruz@gmail.com" required>
            </div>
          </div>

          <!-- Password Input -->
          <div class="input-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <!-- Lock SVG Icon -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input type="password" id="password" placeholder="••••••••••••" required>
              <span class="eye-icon" title="Toggle Password Visibility">
                <!-- Eye Off SVG Icon -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                  <line x1="2" y1="2" x2="22" y2="22"></line>
                </svg>
              </span>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <!-- Primary Action Button -->
          <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <!-- Bottom System Status Pill -->
        <div class="status-pill">
          <span class="status-dot"></span>
          <span>System Status: All Gates Operational</span>
        </div>
      </section>
    </div>
  </main>

</body>
</html>
