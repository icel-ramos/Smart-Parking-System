<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Park Easy - Sign In</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <main class="login-backdrop">
    <!-- Subtle Isometric Parking Grid Background Pattern -->
    <div class="bg-grid-pattern"></div>

    <div class="login-center">
      <!-- Top Brand Logo -->
      <div class="brand-logo">
        <span data-icon="logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle; margin-right: 8px;">
            <rect width="28" height="28" rx="7" fill="#2563EB"/>
            <path d="M9.5 19.5V8.5H14.2C15.8 8.5 17 9.0 17.8 9.8C18.5 10.5 18.8 11.4 18.8 12.5C18.8 13.6 18.5 14.5 17.8 15.2C17 16.0 15.8 16.5 14.2 16.5H11.8V19.5H9.5ZM11.8 14.5H14.1C15.5 14.5 16.4 13.8 16.4 12.5C16.4 11.2 15.5 10.5 14.1 10.5H11.8V14.5Z" fill="white"/>
          </svg>
        </span>Park Easy
      </div>

      <!-- Centered White Login Card -->
      <section class="login-card">
        <div class="card-header">
          <h1>Sign in to Park Easy</h1>
          <p>Admin Dashboard Access</p>
        </div>

        <form action="#">
          <!-- Email Input -->
          <div class="input-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <!-- Envelope SVG Icon -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
              </span>
              <input type="email" id="email" placeholder="e.g., adminlogin@parkeasy.ph" required>
            </div>
          </div>

          <!-- Password Input -->
          <div class="input-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <!-- Lock SVG Icon -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input type="password" id="password" placeholder="••••••••••••" required>
              <span class="eye-icon" title="Toggle Password Visibility">
                <!-- Eye Off SVG Icon -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                  <line x1="2" y1="2" x2="22" y2="22"></line>
                </svg>
              </span>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <!-- Primary Action Button -->
          <button type="submit" class="btn-submit">Sign In</button>
        </form>
      </section>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4KDS_I3LwaFb8J-lJRTv_pmcV3uT8yt8",
      authDomain: "park-easy-system.firebaseapp.com",
      databaseURL: "https://park-easy-system-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "park-easy-system",
      storageBucket: "park-easy-system.firebasestorage.app",
      messagingSenderId: "870151045700",
      appId: "1:870151045700:web:30341624d7860c107db211"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.querySelector("form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const eyeIcon = document.querySelector(".eye-icon");
    const rememberCheckbox = document.querySelector('.checkbox-label input[type="checkbox"]');
    const forgotLink = document.querySelector(".forgot-link");
    const submitBtn = document.querySelector(".btn-submit");

    const errorBanner = document.createElement("div");
    errorBanner.className = "error-banner";
    errorBanner.hidden = true;
    form.parentNode.insertBefore(errorBanner, form);

    // 1. Restore remembered email if saved previously
    window.addEventListener("DOMContentLoaded", () => {
      const savedEmail = localStorage.getItem("parkEasyEmail");
      if (savedEmail) {
        emailInput.value = savedEmail;
        rememberCheckbox.checked = true;
      }
    });

    // 2. Toggle password visibility when clicking the eye icon
    eyeIcon.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";

      eyeIcon.innerHTML = isPassword
        ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>`
        : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
            <line x1="2" y1="2" x2="22" y2="22"></line>
          </svg>`;
    });

    // 3. Handle Firebase Sign-In Form Submission
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBanner.hidden = true;
      errorBanner.style.background = "";
      errorBanner.style.color = "";
      errorBanner.style.borderColor = "";

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        errorBanner.textContent = "Please enter both your email address and password.";
        errorBanner.hidden = false;
        return;
      }

      if (rememberCheckbox.checked) {
        localStorage.setItem("parkEasyEmail", email);
      } else {
        localStorage.removeItem("parkEasyEmail");
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in...";

      try {
        const persistenceMode = rememberCheckbox.checked
          ? browserLocalPersistence
          : browserSessionPersistence;

        await setPersistence(auth, persistenceMode);
        await signInWithEmailAndPassword(auth, email, password);

        sessionStorage.setItem("parkEasyLoggedIn", "true");
        window.location.href = "dashboard.html";
      } catch (error) {
        errorBanner.textContent = "Invalid email or password. Please try again.";
        errorBanner.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });

    // 4. Forgot password handler via Firebase Auth (inline banner, no native alert)
    forgotLink.addEventListener("click", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      errorBanner.style.background = "";
      errorBanner.style.color = "";
      errorBanner.style.borderColor = "";

      if (!email) {
        errorBanner.textContent = "Enter your email address above first to receive a password reset link.";
        errorBanner.hidden = false;
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        errorBanner.style.background = "#eff6ff";
        errorBanner.style.color = "#1d4ed8";
        errorBanner.style.borderColor = "#bfdbfe";
        errorBanner.textContent = `If ${email} is registered, a password reset link has been sent.`;
        errorBanner.hidden = false;
      } catch (err) {
        errorBanner.textContent = "Please contact your Park Easy System Administrator to reset your password.";
        errorBanner.hidden = false;
      }
    });
  </script>

</body>
</html>
